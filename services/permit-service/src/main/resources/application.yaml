server:
  port: 8080
  shutdown: graceful
spring:
  application:
    name: permit-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:pgbouncer}:${DB_PORT:6432}/ipp?prepareThreshold=0&ApplicationName=permit-service
    username: permits_svc
    password: ${DB_PASSWORD}
    hikari:
      # [MANUAL CHANGE – Marom] maximum-pool-size
      # ברירת מחדל: 10 → ערך חדש: 10 (מתועד) – חישוב ב-ADR 0004
      maximum-pool-size: 10
      # [MANUAL CHANGE – Marom] connection-timeout
      # ברירת מחדל: 30000ms → ערך חדש: 3000ms
      # למה: כשל מהיר במקום תור ארוך של בקשות שמחכות לחיבור
      connection-timeout: 3000
      # [MANUAL CHANGE – Marom] leak-detection-threshold
      # ברירת מחדל: 0 (כבוי) → ערך חדש: 20000ms
      # למה: לוג אזהרה על חיבור שלא הוחזר ל-pool
      leak-detection-threshold: 20000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: permits
        jdbc.time_zone: UTC
  liquibase:
    enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:kafka:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        linger.ms: 5
    consumer:
      auto-offset-reset: earliest
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
ipp:
  security:
    jwk-set-uri: ${JWK_SET_URI:http://keycloak:8080/auth/realms/ipp/protocol/openid-connect/certs}
    issuer: ${JWT_ISSUER:http://localhost/auth/realms/ipp}
  policy:
    url: ${POLICY_URL:http://policy-service:8080}
  mock-state:
    url: ${MOCK_STATE_URL:http://mock-state-api:8080}
  seed:
    enabled: ${SEED_ENABLED:true}
resilience4j:
  circuitbreaker:
    instances:
      policy: &cb
        sliding-window-size: 20
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        slow-call-duration-threshold: 1500ms
        slow-call-rate-threshold: 80
      mockState: *cb
  retry:
    instances:
      policy: &retry
        max-attempts: 2
        wait-duration: 150ms
        enable-randomized-wait: true   # jitter – avoids retry storms in sync
        randomized-wait-factor: 0.5
      mockState: *retry
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,circuitbreakers
  endpoint:
    health:
      probes:
        enabled: true
  health:
    circuitbreakers:
      enabled: true
springdoc:
  api-docs:
    path: /v3/api-docs
