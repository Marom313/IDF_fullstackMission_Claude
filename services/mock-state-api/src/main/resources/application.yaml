server:
  port: 8080            # same as every IPP service
  shutdown: graceful

spring:
  application:
    name: mock-state-api
  threads:
    virtual:
      enabled: true     # chaos latency uses Thread.sleep; on virtual threads a sleeping request is almost free
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
