server:
  port: 8080
  shutdown: graceful
spring:
  application:
    name: eligibility-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:pgbouncer}:${DB_PORT:6432}/ipp?prepareThreshold=0&ApplicationName=eligibility-service
    username: eligibility_svc
    password: ${DB_PASSWORD}
    hikari:
      # [MANUAL CHANGE – Marom] maximum-pool-size
      # ברירת מחדל: 10 → ערך חדש: 10 (מתועד) – 3 מופעים × 10 = 30 חיבורי לקוח ב-PgBouncer (ADR 0004)
      maximum-pool-size: 10
      # [MANUAL CHANGE – Marom] connection-timeout
      # ברירת מחדל: 30000ms → ערך חדש: 3000ms
      # למה: בנתיב החם עדיף כשל מהיר מאשר המתנה
      connection-timeout: 3000
      # [MANUAL CHANGE – Marom] leak-detection-threshold
      # ברירת מחדל: 0 (כבוי) → ערך חדש: 20000ms
      # למה: לוג אזהרה על חיבור שלא הוחזר ל-pool
      leak-detection-threshold: 20000
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: 6379
      timeout: 200ms
  liquibase:
    enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:kafka:9092}
    producer:
      acks: 1
      properties:
        linger.ms: 20
    consumer:
      auto-offset-reset: earliest
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      concurrency: 2
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
ipp:
  security:
    jwk-set-uri: ${JWK_SET_URI:http://keycloak:8080/auth/realms/ipp/protocol/openid-connect/certs}
    issuer: ${JWT_ISSUER:http://localhost/auth/realms/ipp}
  outbox:
    enabled: false
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
springdoc:
  api-docs:
    path: /v3/api-docs
