server:
  port: 8084
  shutdown: graceful

spring:
  application:
    name: policy-service
  threads:
    virtual:
      enabled: true          # Java 21 virtual threads: cheap blocking I/O per request
  data:
    mongodb:
      # compose: mongodb://ipp_admin:${MONGO_ROOT_PASSWORD}@mongo:27017/ipp_policies?authSource=admin
      uri: ${MONGO_URI:mongodb://localhost:27017/ipp_policies}
      auto-index-creation: true   # creates the unique (name, version) index from @CompoundIndex
  jackson:
    default-property-inclusion: non_null
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:}

ipp:
  security:
    enabled: ${IPP_SECURITY_ENABLED:false}
  policy:
    seed-enabled: ${IPP_POLICY_SEED:true}
    snapshot-refresh: PT30S

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.ipp: INFO
