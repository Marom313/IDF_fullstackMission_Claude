server:
  port: 8080            # same as every IPP service
  shutdown: graceful

spring:
  application:
    name: policy-service
  threads:
    virtual:
      enabled: true          # Java 21 virtual threads: cheap blocking I/O per request
  data:
    mongodb:
      # least-privilege user created by infra/mongo/init-users.js (readWrite on ipp_policies only)
      uri: ${MONGO_URI:mongodb://policy_svc:${MONGO_POLICY_PASSWORD:dev_mongo_policy}@${MONGO_HOST:mongo}:27017/ipp_policies?authSource=ipp_policies}
      # [MANUAL CHANGE – Marom] auto-index-creation
      # ברירת מחדל: false (מאז Spring Data MongoDB 3.0) → ערך חדש: true
      # למה: בלי זה האינדקס הייחודי (name, version) לא נוצר, ושני פקידים יכולים לשמור את אותה גרסה פעמיים
      auto-index-creation: true
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  security:
    oauth2:
      resourceserver:
        jwt:
          # same pattern as the other services: keys fetched inside the compose network
          jwk-set-uri: ${JWK_SET_URI:http://keycloak:8080/auth/realms/ipp/protocol/openid-connect/certs}

ipp:
  security:
    enabled: ${IPP_SECURITY_ENABLED:true}
  policy:
    seed-enabled: ${IPP_POLICY_SEED:true}
    # [MANUAL CHANGE – Marom] snapshot-refresh
    # ברירת מחדל: אין (הגדרה שלנו) → ערך חדש: PT30S
    # למה: מופע אחר עלול לפרסם חוקה; כל מופע מרענן את רשימת החוקות הפעילות בזיכרון כל 30 שניות
    snapshot-refresh: PT30S

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs

logging:
  level:
    il.ipp: INFO
