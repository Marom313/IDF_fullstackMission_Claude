# IPP – Docker Compose. Profiles: core (default via .env), ingest (NiFi), observability.
# Every container has mem_limit + cpus so the dev machine never freezes. core target ≤ 8GB.
name: ipp

x-common: &common
  restart: unless-stopped
  networks: [ipp]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

x-spring-service: &spring-service
  restart: unless-stopped
  networks: [ipp]
  profiles: [core]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }
  mem_limit: 512m
  cpus: 1.0
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health/readiness | grep -q UP"]
    interval: 10s
    timeout: 5s
    retries: 30
    start_period: 60s

x-spring-env: &spring-env
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70 -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -Xss512k"
  SPRING_THREADS_VIRTUAL_ENABLED: "true"
  TZ: UTC

services:
  # ───────────────────────── infra ─────────────────────────
  postgres:
    <<: *common
    image: postgres:17.6-alpine
    profiles: [core]
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    environment:
      POSTGRES_DB: ipp
      POSTGRES_USER: ipp_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REGISTRY_DB_PASSWORD: ${REGISTRY_DB_PASSWORD}
      PERMITS_DB_PASSWORD: ${PERMITS_DB_PASSWORD}
      ELIGIBILITY_DB_PASSWORD: ${ELIGIBILITY_DB_PASSWORD}
      ENFORCEMENT_DB_PASSWORD: ${ENFORCEMENT_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    shm_size: 128m
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ipp_admin -d ipp"]
      interval: 5s
      timeout: 3s
      retries: 20

  pgbouncer:
    <<: *common
    build: { context: ./infra/pgbouncer }
    image: ipp/pgbouncer:0.1.0
    profiles: [core]
    environment:
      REGISTRY_DB_PASSWORD: ${REGISTRY_DB_PASSWORD}
      PERMITS_DB_PASSWORD: ${PERMITS_DB_PASSWORD}
      ELIGIBILITY_DB_PASSWORD: ${ELIGIBILITY_DB_PASSWORD}
      ENFORCEMENT_DB_PASSWORD: ${ENFORCEMENT_DB_PASSWORD}
    depends_on:
      postgres: { condition: service_healthy }
    mem_limit: 64m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=$$REGISTRY_DB_PASSWORD psql -h 127.0.0.1 -p 6432 -U registry_svc -d ipp -tAc 'select 1' | grep -q 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  mongo:
    <<: *common
    image: mongo:8.0.12
    profiles: [core]
    command: ["--wiredTigerCacheSizeGB", "0.25", "--quiet"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ipp_admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_AUDIT_PASSWORD: ${MONGO_AUDIT_PASSWORD}
      MONGO_POLICY_PASSWORD: ${MONGO_POLICY_PASSWORD}
    volumes:
      - mongodata:/data/db
      - ./infra/mongo/init-users.js:/docker-entrypoint-initdb.d/10-users.js:ro
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    <<: *common
    image: redis:7.4.5-alpine
    profiles: [core]
    # maxmemory + LRU: Redis evicts instead of growing past the container limit
    command: ["redis-server", "--maxmemory", "96mb", "--maxmemory-policy", "volatile-lru", "--save", "", "--appendonly", "no"]
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    <<: *common
    image: apache/kafka:3.9.1
    profiles: [core]
    environment:
      CLUSTER_ID: "SVBQLWRlbW8tY2x1c3Rlci0x"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_HEAP_OPTS: "-Xms384m -Xmx384m"
    volumes: [kafkadata:/var/lib/kafka/data]
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 20s

  kafka-ui:
    <<: *common
    image: kafbat/kafka-ui:v1.2.0
    profiles: [core]
    environment:
      KAFKA_CLUSTERS_0_NAME: ipp
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70 -XX:+UseSerialGC"
    ports: ["127.0.0.1:8085:8080"]
    depends_on:
      kafka: { condition: service_healthy }
    mem_limit: 384m
    cpus: 0.5

  keycloak:
    <<: *common
    image: quay.io/keycloak/keycloak:26.3.3
    profiles: [core]
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: http://localhost/auth
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      JAVA_OPTS_KC_HEAP: "-XX:MaxRAMPercentage=65"
    volumes:
      - ./infra/keycloak/ipp-realm.json:/opt/keycloak/data/import/ipp-realm.json:ro
    ports: ["127.0.0.1:8180:8080"]
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /auth/health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  seaweedfs:
    <<: *common
    image: chrislusf/seaweedfs:3.97
    profiles: [core]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        sed -e "s/__S3_ACCESS_KEY__/$$S3_ACCESS_KEY/" -e "s/__S3_SECRET_KEY__/$$S3_SECRET_KEY/"
        /etc/seaweedfs/s3.tpl.json > /tmp/s3.json &&
        exec weed server -dir=/data -ip=seaweedfs -ip.bind=0.0.0.0 -s3 -s3.config=/tmp/s3.json
        -master.volumeSizeLimitMB=64 -volume.max=20
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    volumes:
      - s3data:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.tpl.json:ro
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9333/cluster/status >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20

  # ───────────────────────── migrations ─────────────────────────
  migrate:
    image: liquibase/liquibase:4.33.0
    profiles: [core]
    networks: [ipp]
    restart: "no"
    entrypoint: ["/bin/sh", "/migrate.sh"]
    environment:
      REGISTRY_DB_PASSWORD: ${REGISTRY_DB_PASSWORD}
      PERMITS_DB_PASSWORD: ${PERMITS_DB_PASSWORD}
      ELIGIBILITY_DB_PASSWORD: ${ELIGIBILITY_DB_PASSWORD}
      ENFORCEMENT_DB_PASSWORD: ${ENFORCEMENT_DB_PASSWORD}
      JAVA_OPTS: "-Xmx256m -XX:+UseSerialGC"
    volumes:
      - ./infra/migrate/migrate.sh:/migrate.sh:ro
      - ./libs/java-common/src/main/resources:/changelogs/common:ro
      - ./services/registry-service/src/main/resources:/changelogs/registry-service:ro
      - ./services/permit-service/src/main/resources:/changelogs/permit-service:ro
      - ./services/eligibility-service/src/main/resources:/changelogs/eligibility-service:ro
      - ./services/enforcement-service/src/main/resources:/changelogs/enforcement-service:ro
    depends_on:
      postgres: { condition: service_healthy }
    mem_limit: 384m
    cpus: 1.0

  # ───────────────────────── domain services ─────────────────────────
  registry-service:
    <<: *spring-service
    build: { context: ., dockerfile: services/Dockerfile, args: { SERVICE: registry-service } }
    image: ipp/registry-service:0.1.0
    environment:
      <<: *spring-env
      DB_PASSWORD: ${REGISTRY_DB_PASSWORD}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    ports: ["127.0.0.1:8081:8080"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      pgbouncer: { condition: service_healthy }
      kafka: { condition: service_healthy }
      seaweedfs: { condition: service_healthy }

  permit-service:
    <<: *spring-service
    build: { context: ., dockerfile: services/Dockerfile, args: { SERVICE: permit-service } }
    image: ipp/permit-service:0.1.0
    environment:
      <<: *spring-env
      DB_PASSWORD: ${PERMITS_DB_PASSWORD}
    ports: ["127.0.0.1:8082:8080"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      pgbouncer: { condition: service_healthy }
      kafka: { condition: service_healthy }

  eligibility-service:
    <<: *spring-service
    build: { context: ., dockerfile: services/Dockerfile, args: { SERVICE: eligibility-service } }
    image: ipp/eligibility-service:0.1.0
    environment:
      <<: *spring-env
      DB_PASSWORD: ${ELIGIBILITY_DB_PASSWORD}
    # no host port: scalable with --scale eligibility-service=3 (gateway → docker DNS round-robin)
    depends_on:
      migrate: { condition: service_completed_successfully }
      pgbouncer: { condition: service_healthy }
      kafka: { condition: service_healthy }
      redis: { condition: service_healthy }

  enforcement-service:
    <<: *spring-service
    build: { context: ., dockerfile: services/Dockerfile, args: { SERVICE: enforcement-service } }
    image: ipp/enforcement-service:0.1.0
    environment:
      <<: *spring-env
      DB_PASSWORD: ${ENFORCEMENT_DB_PASSWORD}
    ports: ["127.0.0.1:8084:8080"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      pgbouncer: { condition: service_healthy }
      kafka: { condition: service_healthy }

  audit-service:
    <<: *spring-service
    build: { context: ., dockerfile: services/Dockerfile, args: { SERVICE: audit-service } }
    image: ipp/audit-service:0.1.0
    environment:
      <<: *spring-env
      MONGO_AUDIT_PASSWORD: ${MONGO_AUDIT_PASSWORD}
    ports: ["127.0.0.1:8086:8080"]
    volumes:
      - ./ingest/quarantine:/ingest/quarantine:ro
    depends_on:
      mongo: { condition: service_healthy }
      kafka: { condition: service_healthy }

  gateway:
    <<: *spring-service
    build: { context: ., dockerfile: services/Dockerfile, args: { SERVICE: gateway } }
    image: ipp/gateway:0.1.0
    environment:
      <<: *spring-env
    depends_on:
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }

  nginx:
    <<: *common
    image: nginx:1.28.0-alpine
    profiles: [core]
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/security-headers.conf:/etc/nginx/security-headers.conf:ro
      - ./infra/nginx/html:/usr/share/nginx/html:ro
    ports: ["127.0.0.1:80:80"]
    mem_limit: 64m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 10

networks:
  ipp: {}

volumes:
  pgdata: {}
  mongodata: {}
  kafkadata: {}
  s3data: {}
