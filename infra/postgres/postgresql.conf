# IPP – PostgreSQL 17 server configuration.
# Only parameters that differ from the default (or are explicitly documented) appear here.
# Every change is marked [MANUAL CHANGE – Marom]. Summary table: docs/adr/0004-postgres-tuning.md

# [MANUAL CHANGE – Marom] listen_addresses
# ברירת מחדל: 'localhost' → ערך חדש: '*'
# למה: קובץ config מותאם מחליף את ברירת המחדל של האימג'; בלי זה PgBouncer והשירותים ברשת compose לא יוכלו להתחבר
listen_addresses = '*'

# [MANUAL CHANGE – Marom] max_connections
# ברירת מחדל: 100 → ערך חדש: 200
# למה: PgBouncer מרכז את החיבורים; 200 משאיר מקום לשירותים, ל-migrate ולכלי ניהול
max_connections = 200

# [MANUAL CHANGE – Marom] superuser_reserved_connections (מתועד בלבד, ללא שינוי)
# ברירת מחדל: 3 → ערך חדש: 3
# למה: שומר 3 חיבורים ל-superuser גם כשהשרת מלא – כדי שאפשר יהיה להיכנס ולתקן
superuser_reserved_connections = 3

# [MANUAL CHANGE – Marom] statement_timeout
# ברירת מחדל: 0 (ללא הגבלה) → ערך חדש: 30s (ולשירותי web: 5s ברמת role, ראו init)
# למה: שאילתה תקועה לא תחזיק חיבור וזיכרון לנצח
statement_timeout = 30s

# [MANUAL CHANGE – Marom] lock_timeout
# ברירת מחדל: 0 → ערך חדש: 5s
# למה: טרנזקציה שמחכה לנעילה נכשלת מהר במקום ליצור שרשרת המתנות
lock_timeout = 5s

# [MANUAL CHANGE – Marom] idle_in_transaction_session_timeout
# ברירת מחדל: 0 → ערך חדש: 60s
# למה: טרנזקציה פתוחה ששוכחים לסגור מחזיקה נעילות וחוסמת VACUUM
idle_in_transaction_session_timeout = 60s

# [MANUAL CHANGE – Marom] idle_session_timeout – לא גלובלי!
# ברירת מחדל: 0 → נשאר 0 כאן; 10min מוגדר רק ב-ALTER ROLE לתפקידים אינטראקטיביים (init/01-roles.sh)
# למה: הגדרה גלובלית הייתה מנתקת את חיבורי ה-pool של PgBouncer
idle_session_timeout = 0

# [MANUAL CHANGE – Marom] shared_buffers
# ברירת מחדל: 128MB → ערך חדש: 256MB
# למה: בערך 50% מזיכרון הקונטיינר (512MB) – cache פנימי של דפי טבלאות
shared_buffers = 256MB

# [MANUAL CHANGE – Marom] work_mem
# ברירת מחדל: 4MB → ערך חדש: 8MB
# למה: מיון ו-hash בשאילתות דשבורד בלי לשפוך לדיסק; נמוך כי מוכפל בכל פעולה בכל חיבור
work_mem = 8MB

# [MANUAL CHANGE – Marom] effective_cache_size
# ברירת מחדל: 4GB → ערך חדש: 1GB
# למה: רמז ל-planner בלבד; מוקטן כי הקונטיינר מוגבל ל-512MB (ועוד page cache של ה-OS)
effective_cache_size = 1GB

# [MANUAL CHANGE – Marom] log_min_duration_statement
# ברירת מחדל: -1 (כבוי) → ערך חדש: 500ms
# למה: כל שאילתה איטית מחצי שנייה נכתבת ללוג – כך מוצאים צווארי בקבוק
log_min_duration_statement = 500ms

# [MANUAL CHANGE – Marom] shared_preload_libraries
# ברירת מחדל: '' → ערך חדש: 'pg_stat_statements'
# למה: סטטיסטיקה מצטברת לכל שאילתה (זמן, כמות) – בסיס ל-tuning
shared_preload_libraries = 'pg_stat_statements'
