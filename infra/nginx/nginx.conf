worker_processes 1;
events { worker_connections 1024; }
http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off;
  sendfile on;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
  client_max_body_size 10m;

  # Docker DNS; variables in proxy_pass resolve per request, so nginx starts
  # even if an upstream (gateway) is not up yet.
  resolver 127.0.0.11 valid=10s ipv6=off;

  map $http_x_correlation_id $corr_id { default $http_x_correlation_id; "" $request_id; }

  server {
    listen 80;
    root /usr/share/nginx/html;

    location = /healthz { access_log off; return 200 "ok\n"; }

    location /api/ {
      include /etc/nginx/security-headers.conf;
      set $gw http://gateway:8080;
      proxy_pass $gw;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Correlation-Id $corr_id;
      # SSE: no buffering, long read
      proxy_buffering off;
      proxy_read_timeout 1h;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
    }

    # Keycloak behind same origin -> one issuer URL for browser and services
    location /auth/ {
      set $kc http://keycloak:8080;
      proxy_pass $kc;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port $server_port;
      proxy_buffer_size 64k;
      proxy_buffers 8 64k;
    }

    location /assets/ {
      include /etc/nginx/security-headers.conf;
      expires 1y;
      add_header Cache-Control "public, immutable";
      try_files $uri =404;
    }

    location / {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-cache";
      try_files $uri $uri/ /index.html;
    }
  }
}
