; IPP – PgBouncer. Only non-default values; each marked [MANUAL CHANGE – Marom].

[databases]
; [MANUAL CHANGE – Marom] databases
; ברירת מחדל: אין → ערך חדש: ipp → postgres:5432
; למה: כל השירותים מתחברים ל-DB אחד (schema לכל שירות), דרך PgBouncer
ipp = host=postgres port=5432 dbname=ipp

[pgbouncer]
; [MANUAL CHANGE – Marom] listen_addr
; ברירת מחדל: localhost → ערך חדש: 0.0.0.0
; למה: השירותים מתחברים מקונטיינרים אחרים ברשת compose
listen_addr = 0.0.0.0
listen_port = 6432

; [MANUAL CHANGE – Marom] auth_type
; ברירת מחדל: md5 → ערך חדש: scram-sha-256
; למה: Postgres 17 שומר סיסמאות ב-SCRAM; md5 מיושן
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; [MANUAL CHANGE – Marom] pool_mode
; ברירת מחדל: session → ערך חדש: transaction
; למה: חיבור לשרת מוחזק רק לאורך טרנזקציה → מאות חיבורי לקוח על עשרות חיבורי שרת.
;       מחייב prepareThreshold=0 ב-JDBC (אין prepared statements בין טרנזקציות)
pool_mode = transaction

; [MANUAL CHANGE – Marom] max_client_conn
; ברירת מחדל: 100 → ערך חדש: 500
; למה: כמה מופעים של כל שירות (--scale) × HikariCP pool
max_client_conn = 500

; [MANUAL CHANGE – Marom] default_pool_size
; ברירת מחדל: 20 → ערך חדש: 20 (מתועד) – לכל זוג user/db
; למה: 4 users × 20 = 80 חיבורי שרת, הרבה מתחת ל-max_connections=200
default_pool_size = 20

; [MANUAL CHANGE – Marom] server_reset_query
; ברירת מחדל: DISCARD ALL → ערך חדש: ריק
; למה: במצב transaction לא רלוונטי (התיעוד ממליץ להשאיר ריק)
server_reset_query =

; [MANUAL CHANGE – Marom] ignore_startup_parameters
; ברירת מחדל: ריק → ערך חדש: extra_float_digits,search_path
; למה: דרייבר JDBC שולח extra_float_digits ב-startup; בלי זה PgBouncer דוחה את החיבור
ignore_startup_parameters = extra_float_digits,search_path

; [MANUAL CHANGE – Marom] unix_socket_dir
; ברירת מחדל: /tmp → ערך חדש: /var/run/pgbouncer
; למה: ספרייה שבבעלות המשתמש pgbouncer (לא root)
unix_socket_dir = /var/run/pgbouncer

