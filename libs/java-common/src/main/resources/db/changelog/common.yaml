# Shared tables (outbox, inbox, idempotency) – included by each service's master changelog.
# Rule: never edit an applied changeset; add a new one.
databaseChangeLog:
  - changeSet:
      id: common-001-outbox
      author: ipp
      changes:
        - sql:
            sql: >
              create table outbox (
                id uuid primary key,
                topic varchar(200) not null,
                msg_key varchar(100),
                payload jsonb not null,
                created_at timestamptz not null default now(),
                sent_at timestamptz
              );
              create index ix_outbox_unsent on outbox (created_at) where sent_at is null;
      rollback:
        - sql: { sql: drop table outbox; }
  - changeSet:
      id: common-002-inbox
      author: ipp
      changes:
        - sql:
            sql: >
              create table inbox (
                message_id varchar(100) not null,
                consumer varchar(100) not null,
                processed_at timestamptz not null,
                primary key (message_id, consumer)
              );
      rollback:
        - sql: { sql: drop table inbox; }
  - changeSet:
      id: common-003-idempotency
      author: ipp
      changes:
        - sql:
            sql: >
              create table idempotency_keys (
                idem_key varchar(100) not null,
                scope varchar(100) not null,
                resource_id varchar(100) not null,
                created_at timestamptz not null,
                primary key (idem_key, scope)
              );
      rollback:
        - sql: { sql: drop table idempotency_keys; }
